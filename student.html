<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #4facfe;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #2389e8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }

        .result p {
            margin: 8px 0;
            color: #333;
        }

        .pass {
            color: green !important;
            font-weight: bold;
        }

        .fail {
            color: red !important;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Result Calculator</h2>
        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter student name">
        </div>
        <div class="input-group">
            <label>Subject 1</label>
            <input type="number" id="sub1" min="0" max="100" placeholder="Enter marks">
        </div>
        <div class="input-group">
            <label>Subject 2</label>
            <input type="number" id="sub2" min="0" max="100" placeholder="Enter marks">
        </div>
        <div class="input-group">
            <label>Subject 3</label>
            <input type="number" id="sub3" min="0" max="100" placeholder="Enter marks">
        </div>
        <div class="input-group">
            <label>Subject 4</label>
            <input type="number" id="sub4" min="0" max="100" placeholder="Enter marks">
        </div>
        <div class="input-group">
            <label>Subject 5</label>
            <input type="number" id="sub5" min="0" max="100" placeholder="Enter marks">
        </div>
        <button onclick="calculateResult()">
            Calculate Result
        </button>
        <div class="result" id="result">
            <p><strong>Student:</strong>
                <span id="studentName"></span>
            </p>
            <p><strong>Total Marks:</strong>
                <span id="total"></span> / 500
            </p>
            <p><strong>Percentage:</strong>
                <span id="percentage"></span>%
            </p>
            <p><strong>Grade:</strong>
                <span id="grade"></span>
            </p>
            <p><strong>Result:</strong>
                <span id="status"></span>
            </p>
        </div>
    </div>
    <script>
        function calculateResult() {
            const name = document.getElementById("name").value.trim();
            const marks = [
                Number(document.getElementById("sub1").value),
                Number(document.getElementById("sub2").value),
                Number(document.getElementById("sub3").value),
                Number(document.getElementById("sub4").value),
                Number(document.getElementById("sub5").value)
            ];
            // Check input
            if (name === "") {
                alert("Please enter student name.");
                return;
            }
            for (let mark of marks) {
                if (mark < 0 || mark > 100 || isNaN(mark)) {
                    alert("Please enter valid marks between 0 and 100.");
                    return;
                }
            }
            // Calculate total
            const total = marks.reduce((sum, mark) => sum + mark, 0);
            // Calculate percentage
            const percentage = total / 5;
            // Calculate grade
            let grade;
            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }
            // Pass if every subject is at least 35
            const passed = marks.every(mark => mark >= 35);
            // Display result
            document.getElementById("studentName").textContent = name;
            document.getElementById("total").textContent = total;
            document.getElementById("percentage").textContent =
                percentage.toFixed(2);
            document.getElementById("grade").textContent = grade;
            const status = document.getElementById("status");
            if (passed) {
                status.textContent = "PASS";
                status.className = "pass";
            } else {
                status.textContent = "FAIL";
                status.className = "fail";
            }
            document.getElementById("result").style.display = "block";
        }
    </script>
</body>

</html>
